services:
  - type: web
    name: olise-ai
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: XLAYER_PRIVATE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_BUCKET
        value: olise-reports
      - key: PORT
        value: "8000"
